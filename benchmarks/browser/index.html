<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WASM benchmark</title>
    <style>
      body {
        font-family: ui-monospace, monospace;
        padding: 1rem;
      }
      pre {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <pre id="status">running...</pre>
    <script>
      const statusEl = document.getElementById('status')

      function round(value) {
        return Math.round(value * 1000) / 1000
      }

      function percentile(sorted, p) {
        if (sorted.length === 0) return 0
        const rank = Math.min(
          sorted.length - 1,
          Math.max(0, Math.ceil(p * sorted.length) - 1),
        )
        return sorted[rank]
      }

      function summarize(samples) {
        if (samples.length === 0) return { samples: [] }
        const sorted = [...samples].sort((a, b) => a - b)
        const mean =
          sorted.reduce((total, value) => total + value, 0) / sorted.length
        return {
          samples,
          mean_ms: round(mean),
          p50_ms: round(percentile(sorted, 0.5)),
          p95_ms: round(percentile(sorted, 0.95)),
          min_ms: round(sorted[0]),
          max_ms: round(sorted[sorted.length - 1]),
        }
      }

      function call(instance, entry, args) {
        const fn = instance.exports[entry]
        if (typeof fn !== 'function') throw new Error('missing export ' + entry)
        return fn(...args)
      }

      window.runBench = async function runBench(config) {
        const cases = []

        for (const item of config.cases) {
          statusEl.textContent = 'loading ' + item.wasmUrl
          const response = await fetch(item.wasmUrl)
          if (!response.ok)
            throw new Error(
              'wasm fetch failed: ' + response.status + ' for ' + item.wasmUrl,
            )
          const bytes = new Uint8Array(await response.arrayBuffer())
          statusEl.textContent =
            'benchmarking ' + item.id + ' (' + bytes.length + ' bytes)'

          const compileStart = performance.now()
          const module = await WebAssembly.compile(bytes)
          const compileMs = performance.now() - compileStart

          const instantiateStart = performance.now()
          const instance = await WebAssembly.instantiate(module, {})
          const instantiateMs = performance.now() - instantiateStart

          const result = call(instance, item.entry, item.args)
          for (let i = 0; i < config.warmup; i += 1) {
            call(instance, item.entry, item.args)
          }
          const warmSamples = []
          for (let i = 0; i < config.iterations; i += 1) {
            const start = performance.now()
            call(instance, item.entry, item.args)
            warmSamples.push(performance.now() - start)
          }

          const coldCompile = []
          const coldInstantiate = []
          const coldCall = []
          for (let i = 0; i < config.iterations; i += 1) {
            const cStart = performance.now()
            const coldModule = await WebAssembly.compile(bytes)
            coldCompile.push(performance.now() - cStart)

            const iStart = performance.now()
            const coldInstance = await WebAssembly.instantiate(coldModule, {})
            coldInstantiate.push(performance.now() - iStart)

            const rStart = performance.now()
            call(coldInstance, item.entry, item.args)
            coldCall.push(performance.now() - rStart)
          }

          cases.push({
            id: item.id,
            entry: item.entry,
            args: item.args,
            wasmUrl: item.wasmUrl,
            result,
            warm: {
              compile_ms: round(compileMs),
              instantiate_ms: round(instantiateMs),
              call: summarize(warmSamples),
            },
            cold: {
              compile: summarize(coldCompile),
              instantiate: summarize(coldInstantiate),
              call: summarize(coldCall),
            },
          })
        }

        statusEl.textContent = 'done'
        return {
          mode: 'browser',
          iterations: config.iterations,
          warmup: config.warmup,
          userAgent: navigator.userAgent,
          hardwareConcurrency: navigator.hardwareConcurrency || null,
          cases,
        }
      }
    </script>
  </body>
</html>
