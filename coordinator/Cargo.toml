[package]
name = "coordinator"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3.34"
rand = "0.10.3"
axum = { version = "0.8.9", features = ["ws"]}
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
tower-http = {version = "0.7.0", features = ["cors"]}
uuid = { version = "1.0", features = ["v4"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
