[package]
name = "coordinator"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = {version = "0.8.9", features=["ws"]}
futures-util = "0.3.34"
rand = "0.10.3"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
tower-http = {version = "0.7.0", features = ["cors"]}
uuid = { version = "1.0", features = ["v4"] }
